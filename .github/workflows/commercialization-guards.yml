name: DINAVO Commercialization Guards

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commercialization-guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hosting fallback assets
        shell: bash
        run: |
          set -euo pipefail
          test -f HOSTING-FALLBACKS.md
          test -f CLOUDFLARE-PAGES.md
          test -f firebase.json
          test -f netlify.toml
          test -f scripts/cutover-host.mjs
          grep -Fq 'Cloudflare Pages' HOSTING-FALLBACKS.md
          grep -Fq 'Alte Firebase-Instanz – nur Stilllegung' HOSTING-FALLBACKS.md
          grep -Fq 'Netlify Free' HOSTING-FALLBACKS.md
          grep -Fq 'Render Free' HOSTING-FALLBACKS.md
          grep -Fq 'nicht als kommerzieller Produktionsersatz' HOSTING-FALLBACKS.md

      - name: Legal and tax release gates
        shell: bash
        run: |
          set -euo pipefail
          test -f BUSINESS-START-CHECKLIST.md
          test -f ELSTER-FIELD-PREP.md
          test -f AMAZON-ACTIVATION.md
          test -f EBAY-ACTIVATION.md
          test -f TRADEMARK-CHECK.md
          test -f DACH-COMMERCIAL-ROLLOUT.md
          grep -Fq 'Gewerbeanmeldung' BUSINESS-START-CHECKLIST.md
          grep -Fq 'Reverse Charge' BUSINESS-START-CHECKLIST.md
          grep -Fq 'Zusammenfassenden Meldung' BUSINESS-START-CHECKLIST.md
          grep -Fq 'Verbraucherschlichtung' BUSINESS-START-CHECKLIST.md
          grep -Fq 'MONETIZATION_DISABLED' AMAZON-ACTIVATION.md
          grep -Fq 'Als Amazon-Partner verdiene ich an qualifizierten Verkäufen.' AMAZON-ACTIVATION.md
          grep -Fq 'ausdrückliche EPN-Freigabe/Acceptance nachweisen' EBAY-ACTIVATION.md
          grep -Fq 'keine EPN-Partnerlinks aktivieren' EBAY-ACTIVATION.md
          grep -Fq 'MONETIZATION_DISABLED' EBAY-ACTIVATION.md
          grep -Fq 'keine fiktiven Umsätze oder Gewinne' ELSTER-FIELD-PREP.md
          grep -Fq 'Dinavo AB' TRADEMARK-CHECK.md
          grep -Fq 'dinavo.com' TRADEMARK-CHECK.md
          grep -Fq 'keine rechtlich garantierte oder weltweit freie Marke' TRADEMARK-CHECK.md
          grep -Fq 'Klasse 35' TRADEMARK-CHECK.md
          grep -Fq 'kommerzielle Affiliate-Freigabe erfolgt zuerst für Deutschland' DACH-COMMERCIAL-ROLLOUT.md
          grep -Fq 'keine Österreich-spezifische bezahlte Kampagne' DACH-COMMERCIAL-ROLLOUT.md
          grep -Fq 'keine Schweiz-spezifische bezahlte Kampagne' DACH-COMMERCIAL-ROLLOUT.md

      - name: Live legal text must stay conservative
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Verbraucherstreitbeilegung' impressum/index.html
          grep -Fq 'Eine im Einzelfall bestehende gesetzliche Pflicht bleibt unberührt' impressum/index.html
          grep -Fq 'Affiliate-Monetarisierung ist derzeit deaktiviert' index.html
          if grep -Eq "const CLOUDFLARE_TOKEN = '[A-Za-z0-9_-]{16,128}';" analytics.js; then
            grep -Fq '<h2>5. Optionale Reichweitenmessung mit Cloudflare Web Analytics</h2>' datenschutz/index.html
            grep -Fq '<script src="/analytics.js" defer></script>' index.html
            grep -Fq 'Art. 6 Abs. 1 lit. a DSGVO' datenschutz/index.html
            grep -Fq '§ 25 Abs. 1 TDDDG' datenschutz/index.html
          else
            ! grep -Fq 'Optionale Reichweitenmessung mit Cloudflare Web Analytics' datenschutz/index.html
            ! grep -Fq '<script src="/analytics.js" defer></script>' index.html
            ! grep -Fq 'Art. 6 Abs. 1 lit. a DSGVO' datenschutz/index.html
            ! grep -Fq '§ 25 Abs. 1 TDDDG' datenschutz/index.html
          fi
          ! grep -Fq 'supabase.co/functions/v1' index.html impressum/index.html datenschutz/index.html nutzungsbedingungen/index.html app.js analytics.js _headers vercel.json
          ! grep -Eq '__DINAVO_PROJECT_EMAIL__|\[Projekt-Adresse eintragen\]' impressum/index.html
          grep -Fq 'dealfaz.social@gmail.com' impressum/index.html
          if grep -Fq 'wahrscheinlich menschlich' index.html impressum/index.html datenschutz/index.html nutzungsbedingungen/index.html; then
            echo 'Ambiguous human-visitor wording detected in live legal text.'
            exit 1
          fi

      - name: Analytics stays consent-first
        shell: bash
        run: |
          set -euo pipefail
          test -f ANALYTICS-MEASUREMENT.md
          grep -Eq 'Datenschutz-Ziffer 5 sind als gemeinsames( optionales)? Release vorbereitet' ANALYTICS-MEASUREMENT.md
          test -f scripts/analytics-release-gate.mjs
          grep -Fq "readConsent() !== 'granted'" analytics.js
          grep -Eq "const CLOUDFLARE_TOKEN = '([A-Za-z0-9_-]{16,128})?';" analytics.js
          grep -Fq 'https://static.cloudflareinsights.com/beacon.min.js' analytics.js
          grep -Fq 'Enable with JS Snippet installation' ANALYTICS-MEASUREMENT.md
          grep -Fq 'Cache-Control: public, max-age=0, must-revalidate, no-transform' _headers
          grep -Fq 'kein PostHog, Google Analytics, Supabase-Pixel oder Affiliate-Tracking' ANALYTICS-MEASUREMENT.md
          grep -Fq 'keine eindeutigen Menschen' ANALYTICS-MEASUREMENT.md
          node scripts/analytics-release-gate.mjs

      - name: Organic beta campaign stays non-commercial
        shell: bash
        run: |
          set -euo pipefail
          test -f ORGANIC-BETA-CAMPAIGN.md
          grep -Fq 'ausschließlich organische, unbezahlte Beiträge' ORGANIC-BETA-CAMPAIGN.md
          grep -Fq 'keine Affiliate- oder Partnerlinks' ORGANIC-BETA-CAMPAIGN.md
          grep -Fq 'Keine Gewinn- oder Verkaufsgarantie' ORGANIC-BETA-CAMPAIGN.md
          ! grep -Eq '([?&]|&amp;)tag=|dealfaz-21|supabase\.co/functions/v1' ORGANIC-BETA-CAMPAIGN.md social/*.svg

      - name: Indexing claims must stay conservative
        shell: bash
        run: |
          set -euo pipefail
          test -f INDEXING-STATUS.md
          grep -Fq 'Indexierung, Positionen und Besucherzahlen werden nicht garantiert' INDEXING-STATUS.md
          grep -Fq 'reale Indexierung der aktuellen Vercel-URLs' INDEXING-STATUS.md
          grep -Fq 'Alte Hosts nicht erneut als primäre öffentliche URL bewerben' INDEXING-STATUS.md

      - name: Cutover must enforce legal notice
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Verbraucherstreitbeilegung:' scripts/cutover-host.mjs
          grep -Fq 'nicht freiwillig zur Teilnahme' scripts/cutover-host.mjs
          grep -Fq 'Production origin must use HTTPS' scripts/cutover-host.mjs

      - name: Monetization remains locked before clearance
        shell: bash
        run: |
          set -euo pipefail
          test -f MONETIZATION_DISABLED
          grep -Fq 'monetization is intentionally disabled' MONETIZATION_DISABLED
          if grep -Eq '([?&]|&amp;)tag=|dealfaz-21' index.html app.js analytics.js; then
            echo 'Affiliate monetization detected before commercialization gates are cleared.'
            exit 1
          fi
