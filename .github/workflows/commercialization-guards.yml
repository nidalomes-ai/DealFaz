name: DEALFAZ Commercialization Guards

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commercialization-guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hosting fallback assets
        shell: bash
        run: |
          set -euo pipefail
          test -f HOSTING-FALLBACKS.md
          test -f CLOUDFLARE-PAGES.md
          test -f firebase.json
          test -f netlify.toml
          test -f scripts/cutover-host.mjs
          grep -Fq 'Cloudflare Pages' HOSTING-FALLBACKS.md
          grep -Fq 'Firebase Hosting Spark' HOSTING-FALLBACKS.md
          grep -Fq 'Netlify Free' HOSTING-FALLBACKS.md
          grep -Fq 'Render Free' HOSTING-FALLBACKS.md
          grep -Fq 'nicht als kommerzieller Produktionsersatz' HOSTING-FALLBACKS.md

      - name: Legal and tax release gates
        shell: bash
        run: |
          set -euo pipefail
          test -f BUSINESS-START-CHECKLIST.md
          test -f ELSTER-FIELD-PREP.md
          test -f AMAZON-ACTIVATION.md
          test -f TRADEMARK-CHECK.md
          test -f DACH-COMMERCIAL-ROLLOUT.md
          grep -Fq 'Gewerbeanmeldung' BUSINESS-START-CHECKLIST.md
          grep -Fq 'Reverse Charge' BUSINESS-START-CHECKLIST.md
          grep -Fq '§ 18a UStG' BUSINESS-START-CHECKLIST.md
          grep -Fq 'Verbraucherschlichtung' BUSINESS-START-CHECKLIST.md
          grep -Fq 'MONETIZATION_DISABLED' AMAZON-ACTIVATION.md
          grep -Fq 'Als Amazon-Partner verdiene ich an qualifizierten Verkäufen.' AMAZON-ACTIVATION.md
          grep -Fq 'keine fiktiven Umsätze oder Gewinne' ELSTER-FIELD-PREP.md
          grep -Fq 'DEALFA' TRADEMARK-CHECK.md
          grep -Fq 'DEALFAST' TRADEMARK-CHECK.md
          grep -Fq 'kommerzielle Affiliate-Freigabe erfolgt zuerst für Deutschland' DACH-COMMERCIAL-ROLLOUT.md
          grep -Fq 'keine Österreich-spezifische bezahlte Kampagne' DACH-COMMERCIAL-ROLLOUT.md
          grep -Fq 'keine Schweiz-spezifische bezahlte Kampagne' DACH-COMMERCIAL-ROLLOUT.md

      - name: Live legal text must stay conservative
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Verbraucherstreitbeilegung:' index.html
          grep -Fq 'nicht freiwillig zur Teilnahme' index.html
          grep -Fq 'Affiliate-Monetarisierung ist derzeit deaktiviert' index.html
          grep -Fq 'technisch nicht als Bot/Preview erkennbarem Zugriff' index.html
          grep -Fq 'keine Messung eindeutiger Besucher' index.html
          if grep -Fq 'wahrscheinlich menschlich' index.html; then
            echo 'Ambiguous human-visitor wording detected in live legal text.'
            exit 1
          fi

      - name: Analytics reporting must stay neutral
        shell: bash
        run: |
          set -euo pipefail
          test -f ANALYTICS-MEASUREMENT.md
          grep -Fq 'non_bot_or_preview_ua' ANALYTICS-MEASUREMENT.md
          grep -Fq 'keine eindeutigen Besucher' ANALYTICS-MEASUREMENT.md
          grep -Fq 'Niemals aus diesen Aggregaten' ANALYTICS-MEASUREMENT.md

      - name: Indexing claims must stay conservative
        shell: bash
        run: |
          set -euo pipefail
          test -f INDEXING-STATUS.md
          grep -Fq 'Indexierung, Positionen und Besucherzahlen werden nicht garantiert' INDEXING-STATUS.md
          grep -Fq 'Sauberen kommerziell geeigneten Produktionshost aktivieren' INDEXING-STATUS.md

      - name: Cutover must enforce legal notice
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Verbraucherstreitbeilegung:' scripts/cutover-host.mjs
          grep -Fq 'nicht freiwillig zur Teilnahme' scripts/cutover-host.mjs
          grep -Fq 'Production origin must use HTTPS' scripts/cutover-host.mjs

      - name: Monetization remains locked before clearance
        shell: bash
        run: |
          set -euo pipefail
          test -f MONETIZATION_DISABLED
          grep -Fq 'monetization is intentionally disabled' MONETIZATION_DISABLED
          if grep -Eq '([?&]|&amp;)tag=|dealfaz-21' index.html app.js analytics.js; then
            echo 'Affiliate monetization detected before commercialization gates are cleared.'
            exit 1
          fi
