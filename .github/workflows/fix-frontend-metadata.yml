name: Fix DEALFAZ frontend metadata

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-frontend-metadata.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update canonical and social metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://nidalomes-ai.github.io/DealFaz/', 'https://dealfaz.vercel.app/')
          s = s.replace('<link rel="manifest" href="manifest.webmanifest">', '<link rel="manifest" href="/manifest.webmanifest">')
          s = s.replace('<link rel="icon" href="icon.svg" type="image/svg+xml">', '<link rel="icon" href="/icon.svg" type="image/svg+xml">')
          s = s.replace('<link rel="apple-touch-icon" href="icon.svg">', '<link rel="apple-touch-icon" href="/icon.svg">')
          marker = '<meta name="twitter:card" content="summary">'
          if marker in s:
              s = s.replace(marker, '<meta property="og:image" content="https://iosghttnctdaociwltos.supabase.co/functions/v1/dealfaz-social-card">\n  <meta name="twitter:card" content="summary_large_image">')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit metadata fix
        run: |
          git config user.name "DEALFAZ automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Vercel canonical and social metadata"
          git push
