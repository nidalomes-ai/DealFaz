name: Harden DEALFAZ CSV export

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/harden-csv-export.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prevent spreadsheet formula injection
        run: node scripts/harden-csv-export.mjs
      - name: Verify targeted change
        run: |
          grep -Fq 'safeText(d.product)' index.html
          grep -Fq "^[=+\\-@\\t\\r]" index.html
      - name: Commit hardening
        run: |
          git config user.name "DEALFAZ automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Harden CSV export against formula injection"
          git push
