name: DINAVO IndexNow Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/indexnow-vercel.yml'
      - 'index.html'
      - 'app.js'
      - 'analytics.js'
      - 'style.css'
      - 'manifest.webmanifest'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'reselling-rechner/**'
      - 'maximaler-einkaufspreis/**'
      - 'roi-reselling/**'
      - 'sell-through/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Verify IndexNow key on production host
        shell: bash
        run: |
          set -euo pipefail
          key='e6ec43618dca9e6ea85cc60ede8e5831'
          test "$(curl --retry 2 --retry-delay 2 -fsS https://dealfaz.dealfaz-social.workers.dev/${key}.txt)" = "$key"

      - name: Submit production URLs to IndexNow
        shell: bash
        run: |
          set -euo pipefail
          cat > payload.json <<'JSON'
          {
            "host": "dealfaz.dealfaz-social.workers.dev",
            "key": "e6ec43618dca9e6ea85cc60ede8e5831",
            "keyLocation": "https://dealfaz.dealfaz-social.workers.dev/e6ec43618dca9e6ea85cc60ede8e5831.txt",
            "urlList": [
              "https://dealfaz.dealfaz-social.workers.dev/",
              "https://dealfaz.dealfaz-social.workers.dev/reselling-rechner/",
              "https://dealfaz.dealfaz-social.workers.dev/maximaler-einkaufspreis/",
              "https://dealfaz.dealfaz-social.workers.dev/roi-reselling/",
              "https://dealfaz.dealfaz-social.workers.dev/sell-through/"
            ]
          }
          JSON
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST 'https://api.indexnow.org/indexnow' -H 'Content-Type: application/json; charset=utf-8' --data-binary @payload.json)
          echo "IndexNow HTTP $code"
          cat response.txt || true
          test "$code" = "200" -o "$code" = "202"
