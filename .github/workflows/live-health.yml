name: DEALFAZ Live Health

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-health:
    runs-on: ubuntu-latest
    steps:
      - name: Public Cloudflare app is healthy HTML
        id: html
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          headers=$(mktemp)
          body=$(mktemp)
          code=$(curl --retry 2 --retry-delay 2 -sS -D "$headers" -o "$body" -w '%{http_code}' https://dealfaz.dealfaz-social.workers.dev/)
          test "$code" = "200"
          grep -Eiq '^content-type: text/html' "$headers"
          grep -Eiq '^x-content-type-options: nosniff' "$headers"
          grep -Eiq '^x-frame-options: DENY' "$headers"
          grep -Eiq '^referrer-policy: strict-origin-when-cross-origin' "$headers"
          grep -Eiq '^strict-transport-security:' "$headers"
          grep -Eiq '^content-security-policy:' "$headers"
          grep -Fq 'DEALFAZ' "$body"
          grep -Fq 'SCHNELL PRÜFEN' "$body"
          grep -Fq 'Was spricht dagegen?' "$body"
          grep -Fq 'Zwei Deals vergleichen' "$body"
          grep -Fq 'Tatsächliches Ergebnis' "$body"
          grep -Fq 'Mehr lernen' "$body"
          grep -Fq 'apple-mobile-web-app-capable' "$body"
          grep -Fq '<link rel="apple-touch-icon" href="/icon.svg">' "$body"
          grep -Fq 'Datenschutz' "$body"
          grep -Fq 'Impressum' "$body"
          grep -Fq 'Keine Gewinn- oder Verkaufsgarantie' "$body"
          grep -Fq 'Affiliate-Monetarisierung ist derzeit deaktiviert' "$body"
          ! grep -Fq 'Als Amazon-Partner verdiene ich an qualifizierten Verkäufen' "$body"
          ! grep -Fq 'Der Amazon-Link ist ein Partnerlink' "$body"
          ! grep -Fq 'Amazon-Partnerlinks können Affiliate-Zuordnungen enthalten' "$body"
          grep -Fq 'summary_large_image' "$body"
          grep -Fq 'social-card.svg' "$body"
          ! grep -Fq 'supabase.co/functions/v1' "$body"

      - name: Core static assets are reachable
        id: assets
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          check() {
            url="$1"
            expected="$2"
            headers=$(mktemp)
            code=$(curl --retry 2 --retry-delay 2 -sS -D "$headers" -o /dev/null -w '%{http_code}' "$url")
            test "$code" = "200"
            grep -Eiq "^content-type: ${expected}" "$headers"
          }
          check https://dealfaz.dealfaz-social.workers.dev/app.js '(application|text)/(javascript|x-javascript)'
          check https://dealfaz.dealfaz-social.workers.dev/analytics.js '(application|text)/(javascript|x-javascript)'
          check https://dealfaz.dealfaz-social.workers.dev/style.css 'text/css'
          check https://dealfaz.dealfaz-social.workers.dev/manifest.webmanifest 'application/(manifest\+json|json)'
          check https://dealfaz.dealfaz-social.workers.dev/robots.txt 'text/plain'
          check https://dealfaz.dealfaz-social.workers.dev/sitemap.xml '(application|text)/(xml|xml\+rss)'
          check https://dealfaz.dealfaz-social.workers.dev/icon.svg 'image/svg\+xml'
          check https://dealfaz.dealfaz-social.workers.dev/social-card.svg 'image/svg\+xml'

      - name: Monetization, sharing and CSV safety are live
        id: safety
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          js=$(curl --retry 2 --retry-delay 2 -fsS https://dealfaz.dealfaz-social.workers.dev/app.js)
          analytics=$(curl --retry 2 --retry-delay 2 -fsS https://dealfaz.dealfaz-social.workers.dev/analytics.js)
          ! printf '%s' "$js" | grep -Fq 'Amazon · Partnerlink'
          ! printf '%s' "$js" | grep -Fq 'nofollow sponsored noopener'
          ! printf '%s' "$js" | grep -Fq 'dealfaz-21'
          ! printf '%s' "$js" | grep -Eq '([?&]|&amp;)tag=|AMAZON_TAG'
          ! printf '%s' "$js" | grep -Fq 'dealfaz-amazon#q='
          printf '%s' "$js" | grep -Fq "amazon='https://www.amazon.de/s?k='+e"
          printf '%s' "$js" | grep -Fq "['Amazon',amazon,'nofollow noopener noreferrer']"
          printf '%s' "$js" | grep -Fq "'#deal='+encodeURIComponent(p.toString())"
          printf '%s' "$js" | grep -Fq "location.hash.startsWith('#deal=')"
          ! printf '%s' "$js" | grep -Fq "location.origin+location.pathname+'?'+p.toString()"
          printf '%s' "$js" | grep -Fq 'const safeText=v=>'
          printf '%s' "$js" | grep -Fq '/^[=+\-@\t\r]/.test(s)'
          printf '%s' "$analytics" | grep -Fq 'syncPausedAffiliateState'
          printf '%s' "$analytics" | grep -Fq 'Affiliate-Monetarisierung ist derzeit deaktiviert'

      - name: IndexNow key is present on production host
        id: indexnow
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          key='e6ec43618dca9e6ea85cc60ede8e5831'
          body=$(curl --retry 2 --retry-delay 2 -fsS "https://dealfaz.dealfaz-social.workers.dev/${key}.txt")
          test "$body" = "$key"

      - name: SEO knowledge pages are reachable canonical and legal-linked
        id: seo
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          check_page() {
            path="$1"
            canonical="$2"
            body=$(mktemp)
            code=$(curl --retry 2 --retry-delay 2 -sS -o "$body" -w '%{http_code}' "https://dealfaz.dealfaz-social.workers.dev${path}")
            test "$code" = "200"
            grep -Fq "<link rel=\"canonical\" href=\"${canonical}\"" "$body"
            grep -Fq 'DEALFAZ' "$body"
            grep -Fq 'Impressum & Recht' "$body"
            grep -Fq 'href="/#privacy"' "$body"
            ! grep -Fq 'supabase.co/functions/v1' "$body"
          }
          check_page /reselling-rechner/ https://dealfaz.dealfaz-social.workers.dev/reselling-rechner/
          check_page /maximaler-einkaufspreis/ https://dealfaz.dealfaz-social.workers.dev/maximaler-einkaufspreis/
          check_page /roi-reselling/ https://dealfaz.dealfaz-social.workers.dev/roi-reselling/
          check_page /sell-through/ https://dealfaz.dealfaz-social.workers.dev/sell-through/

      - name: Sitemap contains all public pages
        id: sitemap
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sitemap=$(curl --retry 2 --retry-delay 2 -sS https://dealfaz.dealfaz-social.workers.dev/sitemap.xml)
          for url in \
            'https://dealfaz.dealfaz-social.workers.dev/' \
            'https://dealfaz.dealfaz-social.workers.dev/reselling-rechner/' \
            'https://dealfaz.dealfaz-social.workers.dev/maximaler-einkaufspreis/' \
            'https://dealfaz.dealfaz-social.workers.dev/roi-reselling/' \
            'https://dealfaz.dealfaz-social.workers.dev/sell-through/'
          do
            printf '%s' "$sitemap" | grep -Fq "<loc>${url}</loc>"
          done

      - name: Fail if any live check failed
        if: always()
        shell: bash
        env:
          HTML: ${{ steps.html.outcome }}
          ASSETS: ${{ steps.assets.outcome }}
          SAFETY: ${{ steps.safety.outcome }}
          INDEXNOW: ${{ steps.indexnow.outcome }}
          SEO: ${{ steps.seo.outcome }}
          SITEMAP: ${{ steps.sitemap.outcome }}
        run: |
          printf 'html=%s assets=%s safety=%s indexnow=%s seo=%s sitemap=%s\n' "$HTML" "$ASSETS" "$SAFETY" "$INDEXNOW" "$SEO" "$SITEMAP"
          test "$HTML" = success
          test "$ASSETS" = success
          test "$SAFETY" = success
          test "$INDEXNOW" = success
          test "$SEO" = success
          test "$SITEMAP" = success
