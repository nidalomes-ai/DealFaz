name: One-time neutral Amazon direct-link patch

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace neutral Amazon redirect with direct search
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          old = "amazon='https://iosghttnctdaociwltos.supabase.co/functions/v1/dealfaz-amazon#q='+e"
          new = "amazon='https://www.amazon.de/s?k='+e"
          if old not in s:
              raise SystemExit('Expected Amazon redirect pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          grep -Fq "amazon='https://www.amazon.de/s?k='+e" app.js
          ! grep -Fq 'dealfaz-amazon#q=' app.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use direct non-affiliate Amazon search'
          git push
