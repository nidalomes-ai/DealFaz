name: DEALFAZ Quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: DealScore regression tests
        run: node scripts/dealscore-regression.mjs

      - name: Required frontend and governance files
        run: |
          test -f index.html
          test -f app.js
          test -f analytics.js
          test -f style.css
          test -f manifest.webmanifest
          test -f icon.svg
          test -f social-card.svg
          test -f vercel.json
          test -f _headers
          test -f robots.txt
          test -f sitemap.xml
          test -f reselling-rechner/index.html
          test -f maximaler-einkaufspreis/index.html
          test -f roi-reselling/index.html
          test -f sell-through/index.html
          test -f DATA-SOURCES.md
          test -f PRIVACY-ARCHITECTURE.md
          test -f RELEASE-CHECKLIST.md
          test -f LEGAL-GUARDRAILS.md
          test -f MONETIZATION_DISABLED
          test -f CLOUDFLARE-PAGES.md
          test -f SECURITY.md

      - name: Production metadata checks
        shell: bash
        run: |
          set -euo pipefail
          origin='https://dealfaz.dealfaz-social.workers.dev'
          grep -Fq "<link rel=\"canonical\" href=\"${origin}/\">" index.html
          grep -Fq "<meta property=\"og:url\" content=\"${origin}/\">" index.html
          grep -Fq "<meta property=\"og:image\" content=\"${origin}/social-card.svg\">" index.html
          grep -Fq 'summary_large_image' index.html
          grep -Fq '"start_url":"/"' manifest.webmanifest
          grep -Fq "Sitemap: ${origin}/sitemap.xml" robots.txt
          grep -Fq "<loc>${origin}/</loc>" sitemap.xml
          for page in reselling-rechner/index.html maximaler-einkaufspreis/index.html roi-reselling/index.html sell-through/index.html; do
            grep -Fq "${origin}/" "$page"
          done
          ! grep -Fn 'dealfaz.vercel.app' index.html robots.txt sitemap.xml reselling-rechner/index.html maximaler-einkaufspreis/index.html roi-reselling/index.html sell-through/index.html
          ! grep -Fn 'Beim Aufruf verarbeitet Vercel' index.html
          ! grep -Fn 'nidalomes-ai.github.io/DealFaz' index.html robots.txt sitemap.xml README.md DATA-SOURCES.md PRIVACY-ARCHITECTURE.md manifest.webmanifest
          ! grep -Fn 'supabase.co/functions/v1' index.html reselling-rechner/index.html maximaler-einkaufspreis/index.html roi-reselling/index.html sell-through/index.html

      - name: Legal and monetization safety checks
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Keine Gewinn- oder Verkaufsgarantie' index.html
          grep -Fq 'umgeht keine Logins, Paywalls oder technischen Schutzmaßnahmen' index.html
          grep -Fq 'Amazon und andere Plattformen werden nur als externe Originalquellen verlinkt' index.html
          grep -Fq 'Affiliate-Links erst nach tatsächlicher Programmfreigabe verwenden' LEGAL-GUARDRAILS.md
          grep -Fq 'Keine versteckte Provision' LEGAL-GUARDRAILS.md
          grep -Fq 'monetization is intentionally disabled' MONETIZATION_DISABLED
          if grep -Fq 'dealfaz-21' index.html app.js analytics.js; then
            echo 'Affiliate tag detected while monetization lock is active.'
            exit 1
          fi
          if grep -Eq '([?&]|&amp;)tag=|AMAZON_TAG' index.html app.js analytics.js; then
            echo 'Affiliate URL construction detected while monetization lock is active.'
            exit 1
          fi
          if grep -Fq 'Amazon · Partnerlink' index.html app.js analytics.js; then
            echo 'Stale Amazon partner-link label detected while monetization lock is active.'
            exit 1
          fi
          if grep -Fq 'Als Amazon-Partner verdiene' index.html app.js analytics.js; then
            echo 'Stale Amazon commission disclosure detected while monetization lock is active.'
            exit 1
          fi
          if grep -Fq 'Amazon-Partnerlinks können Affiliate-Zuordnungen enthalten' index.html app.js analytics.js; then
            echo 'Stale Amazon affiliate privacy wording detected while monetization lock is active.'
            exit 1
          fi
          if grep -Eq 'nofollow sponsored|rel="[^"]*sponsored' index.html app.js analytics.js; then
            echo 'Sponsored-link marker detected while monetization lock is active.'
            exit 1
          fi
          if grep -Fq 'dealfaz-amazon#q=' app.js; then
            echo 'Fragment-based Amazon redirect detected; search term would not reach the server.'
            exit 1
          fi
          grep -Fq "amazon='https://www.amazon.de/s?k='+e" app.js
          grep -Fq "['Amazon',amazon,'nofollow noopener noreferrer']" app.js
          grep -Fq 'Affiliate-Monetarisierung ist derzeit deaktiviert' index.html
          grep -Fq 'derzeit kein Partnerlink' index.html
          grep -Fq 'keine Gewinn-, Preis-, Nachfrage- oder Verkaufsgarantie' DATA-SOURCES.md
          grep -Fq 'Beim Aufruf verarbeitet Cloudflare' index.html

      - name: SEO legal navigation checks
        shell: bash
        run: |
          set -euo pipefail
          for page in reselling-rechner/index.html maximaler-einkaufspreis/index.html roi-reselling/index.html sell-through/index.html; do
            grep -Fq 'Impressum & Recht' "$page"
            grep -Fq 'href="/#privacy"' "$page"
          done

      - name: Share privacy checks
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "'#deal='+encodeURIComponent(p.toString())" app.js
          grep -Fq "location.hash.startsWith('#deal=')" app.js
          if grep -Fq "location.origin+location.pathname+'?'+p.toString()" app.js; then
            echo 'Share values are still being placed in the request query string.'
            exit 1
          fi

      - name: Paused monetization UI defense
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'syncPausedAffiliateState' analytics.js
          grep -Fq 'Affiliate-Monetarisierung ist derzeit deaktiviert' analytics.js

      - name: CSV export injection hardening
        run: |
          grep -Fq 'const safeText=v=>' app.js
          grep -Fq '/^[=+\-@\t\r]/.test(s)' app.js
          grep -Fq 'rows.map(r=>r.map(csv)' app.js
          grep -Fq "'\\ufeff'" app.js

      - name: No obvious secrets in repository
        shell: bash
        run: |
          set -euo pipefail
          patterns='SUPABASE_SERVICE_ROLE_KEY|sk_live_[A-Za-z0-9]+|ghp_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+|AKIA[0-9A-Z]{16}'
          if grep -RIEq "$patterns" . --exclude-dir=.git --exclude='quality.yml'; then
            echo 'Potential secret pattern found. Failing without printing matching content.'
            exit 1
          fi

      - name: Security headers config
        run: |
          grep -Fq 'X-Content-Type-Options' vercel.json
          grep -Fq 'Referrer-Policy' vercel.json
          grep -Fq 'Permissions-Policy' vercel.json
          grep -Fq 'X-Frame-Options' vercel.json
          grep -Fq 'Strict-Transport-Security' vercel.json
          grep -Fq 'Content-Security-Policy' vercel.json
          grep -Fq 'X-Content-Type-Options' _headers
          grep -Fq 'Referrer-Policy' _headers
          grep -Fq 'Permissions-Policy' _headers
          grep -Fq 'X-Frame-Options' _headers
          grep -Fq 'Strict-Transport-Security' _headers
          grep -Fq 'Content-Security-Policy' _headers

      - name: Cloudflare production workflows are aligned
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'dealfaz.dealfaz-social.workers.dev' .github/workflows/live-health.yml
          grep -Fq 'dealfaz.dealfaz-social.workers.dev' .github/workflows/indexnow-vercel.yml
          ! grep -Fq 'dealfaz.vercel.app' .github/workflows/live-health.yml
          ! grep -Fq 'dealfaz.vercel.app' .github/workflows/indexnow-vercel.yml
