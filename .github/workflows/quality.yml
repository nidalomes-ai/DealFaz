name: DEALFAZ Quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: DealScore regression tests
        run: node scripts/dealscore-regression.mjs

      - name: Required frontend and governance files
        run: |
          test -f index.html
          test -f app.js
          test -f analytics.js
          test -f style.css
          test -f manifest.webmanifest
          test -f icon.svg
          test -f vercel.json
          test -f _headers
          test -f robots.txt
          test -f sitemap.xml
          test -f reselling-rechner/index.html
          test -f maximaler-einkaufspreis/index.html
          test -f roi-reselling/index.html
          test -f sell-through/index.html
          test -f DATA-SOURCES.md
          test -f PRIVACY-ARCHITECTURE.md
          test -f RELEASE-CHECKLIST.md
          test -f LEGAL-GUARDRAILS.md
          test -f SECURITY.md

      - name: Frontend metadata checks
        run: |
          grep -Fq '<link rel="canonical" href="https://dealfaz.vercel.app/">' index.html
          grep -Fq '<meta property="og:url" content="https://dealfaz.vercel.app/">' index.html
          grep -Fq '<meta property="og:image"' index.html
          grep -Fq 'summary_large_image' index.html
          grep -Fq '"start_url":"/"' manifest.webmanifest
          grep -Fq 'Sitemap: https://dealfaz.vercel.app/sitemap.xml' robots.txt
          grep -Fq '<loc>https://dealfaz.vercel.app/</loc>' sitemap.xml
          ! grep -Fn 'nidalomes-ai.github.io/DealFaz' index.html robots.txt sitemap.xml README.md DATA-SOURCES.md PRIVACY-ARCHITECTURE.md manifest.webmanifest

      - name: Legal and monetization safety checks
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Keine Gewinn- oder Verkaufsgarantie' index.html
          grep -Fq 'umgeht keine Logins, Paywalls oder technischen Schutzmaßnahmen' index.html
          grep -Fq 'daraus wird keine Partnerschaft oder Zertifizierung abgeleitet' index.html
          grep -Fq 'Affiliate-Links erst nach tatsächlicher Programmfreigabe verwenden' LEGAL-GUARDRAILS.md
          grep -Fq 'Keine versteckte Provision' LEGAL-GUARDRAILS.md
          if grep -Fq 'dealfaz-21' index.html app.js analytics.js; then
            echo 'Affiliate tag detected while monetization lock is active.'
            exit 1
          fi
          if grep -Eq '([?&]|&amp;)tag=|AMAZON_TAG' index.html app.js analytics.js; then
            echo 'Affiliate URL construction detected while monetization lock is active.'
            exit 1
          fi
          grep -Fq 'keine Gewinn-, Preis-, Nachfrage- oder Verkaufsgarantie' DATA-SOURCES.md

      - name: CSV export injection hardening
        run: |
          grep -Fq 'const safeText=v=>' app.js
          grep -Fq '/^[=+\-@\t\r]/.test(s)' app.js
          grep -Fq 'rows.map(r=>r.map(csv)' app.js
          grep -Fq "'\\ufeff'" app.js

      - name: No obvious secrets in repository
        shell: bash
        run: |
          set -euo pipefail
          patterns='SUPABASE_SERVICE_ROLE_KEY|sk_live_[A-Za-z0-9]+|ghp_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+|AKIA[0-9A-Z]{16}'
          if grep -RIEq "$patterns" . --exclude-dir=.git --exclude='quality.yml'; then
            echo 'Potential secret pattern found. Failing without printing matching content.'
            exit 1
          fi

      - name: Security headers config
        run: |
          grep -Fq 'X-Content-Type-Options' vercel.json
          grep -Fq 'Referrer-Policy' vercel.json
          grep -Fq 'Permissions-Policy' vercel.json
          grep -Fq 'X-Frame-Options' vercel.json
          grep -Fq 'Strict-Transport-Security' vercel.json
          grep -Fq 'Content-Security-Policy' vercel.json
          grep -Fq 'X-Content-Type-Options' _headers
          grep -Fq 'Referrer-Policy' _headers
          grep -Fq 'Permissions-Policy' _headers
          grep -Fq 'X-Frame-Options' _headers
          grep -Fq 'Strict-Transport-Security' _headers
          grep -Fq 'Content-Security-Policy' _headers
