<head>
  <meta charset="UTF-8">

  <meta name="description" content="DealFaz – Deals entdecken, vergleichen und clever handeln.">
  <title>DealFaz – Deals & Reselling</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #070b14;
      color: white;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      padding: 28px 7%;
      font-weight: bold;
      font-size: 24px;
    }

    .logo span, .green { color: #38e6c5; }
    .live { color: #38e6c5; font-size: 14px; }

    main {
      max-width: 900px;
      margin: 110px auto 0;
      text-align: center;
      padding: 20px;
    }

    .region {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid #24334d;
      border-radius: 20px;
      margin-bottom: 25px;
      color: #b8c4d8;
    }

    h1 {
      font-size: clamp(42px, 7vw, 72px);
      line-height: 1.05;
      margin-bottom: 25px;
    }

    p {
      color: #b8c4d8;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .search {
      display: flex;
      background: white;
      padding: 6px;
      border-radius: 12px;
      max-width: 700px;
      margin: auto;
    }

    input {
      flex: 1;
      border: 0;
      outline: 0;
      padding: 17px;
      font-size: 16px;
      border-radius: 9px;
    }

    button {
      border: 0;
      background: #38e6c5;
      padding: 0 28px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    #results {
      max-width: 700px;
      margin: 25px auto;
      text-align: left;
    }

    .result {
      background: #111827;
      border: 1px solid #263248;
      border-radius: 12px;
      padding: 18px;
    }

    .result a {
      color: #38e6c5;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">Deal<span>Faz</span></div>
    <div class="live">● LIVE</div>
  </header>

  <main>
    <div class="region">Deutschland · Österreich · Schweiz</div>

    <h1>Finde den Deal.<br><span class="green">Mach mehr daraus.</span></h1>

    <p>
      DealFaz bringt Deals und Reselling an einen Ort.
      Suche nach einem Artikel und entdecke Möglichkeiten
      zum Kaufen, Vergleichen und Weiterverkaufen.
    </p>

    <div class="search">
      <input id="query" placeholder="Artikelname eingeben">
      <button onclick="searchDeals()">Deal suchen</button>
    </div>

    <div id="results"></div>
  </main>

  <script>
    function searchDeals() {
      const input = document.getElementById("query");
      const query = input.value.trim();
      const results = document.getElementById("results");

      if (!query) {
        results.innerHTML =
          '<div class="result">Bitte zuerst einen Artikel eingeben.</div>';
        return;
      }

      const ebay =
        "https://www.ebay.de/sch/i.html?_nkw=" +
        encodeURIComponent(query);

      const kleinanzeigen =
        "https://www.kleinanzeigen.de/s-" +
        encodeURIComponent(query.replace(/\s+/g, "-")) +
        "/k0";

      results.innerHTML =
        '<div class="result">' +
        '<strong>Suche nach: ' + escapeHtml(query) + '</strong><br><br>' +
        '<a href="' + ebay + '" target="_blank" rel="noopener">→ eBay durchsuchen</a><br><br>' +
        '<a href="' + kleinanzeigen + '" target="_blank" rel="noopener">→ Kleinanzeigen durchsuchen</a>' +
        '</div>';
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById("query").addEventListener("keydown", function(e) {
      if (e.key === "Enter") searchDeals();
    });
  </script>
</script>
</body>

<script>
function calculateDealScore(buyPrice, marketPrice, resalePrice, fees = 0) {
  buyPrice = Number(buyPrice);
  marketPrice = Number(marketPrice);
  resalePrice = Number(resalePrice);
  fees = Number(fees);

  const savings = Math.max(0, marketPrice - buyPrice);
  const profit = Math.max(0, resalePrice - buyPrice - fees);

  let dealScore = 0;
  let resellScore = 0;

  if (marketPrice > 0) {
    const savingsPercent = (savings / marketPrice) * 100;
    dealScore = Math.min(100, Math.round(savingsPercent * 4));
  }

  if (buyPrice > 0) {
    const profitPercent = (profit / buyPrice) * 100;
    resellScore = Math.min(100, Math.round(profitPercent * 3));
  }

  function label(score) {
    if (score >= 90) return "Top-Deal";
    if (score >= 75) return "Guter Deal";
    if (score >= 60) return "Fair";
    if (score >= 40) return "Eher teuer";
    return "Schlecht";
  }

  return {
    savings,
    profit,
    dealScore,
    resellScore,
    dealLabel: label(dealScore),
    resellLabel: label(resellScore)
  };
}

function renderDealScore(buyPrice, marketPrice, resalePrice, fees = 0) {
  const result = calculateDealScore(
    buyPrice,
    marketPrice,
    resalePrice,
    fees
  );

  let box = document.getElementById("dealfaz-score-box");

  if (!box) {
    box = document.createElement("div");
    box.id = "dealfaz-score-box";
    box.style.marginTop = "20px";
    box.style.padding = "20px";
    box.style.borderRadius = "16px";
    box.style.background = "rgba(255,255,255,0.08)";
    box.style.backdropFilter = "blur(8px)";
    box.style.color = "white";
    box.style.fontFamily = "Arial, sans-serif";
    document.body.appendChild(box);
  }

  box.innerHTML = `
    <div style="font-size:24px;font-weight:700;margin-bottom:14px;">
      DealFaz Bewertung
    </div>

    <div style="margin-bottom:10px;">
      Marktpreis:
      <strong>${marketPrice.toFixed(2)} €</strong>
    </div>

    <div style="margin-bottom:10px;">
      Ersparnis:
      <strong>${result.savings.toFixed(2)} €</strong>
    </div>

    <div style="margin-bottom:10px;">
      Möglicher Gewinn:
      <strong>${result.profit.toFixed(2)} €</strong>
    </div>

    <div style="margin-top:18px;">
      <div style="display:flex;justify-content:space-between;">
        <span>Deal-Score</span>
        <strong>${result.dealScore}/100 - ${result.dealLabel}</strong>
      </div>

      <div style="height:14px;background:#ffffff22;border-radius:20px;overflow:hidden;margin-top:8px;">
        <div style="
          width:${result.dealScore}%;
          height:100%;
          background:linear-gradient(90deg,#ff4d4d,#ffd84d,#37e27d);
        "></div>
      </div>
    </div>

    <div style="margin-top:18px;">
      <div style="display:flex;justify-content:space-between;">
        <span>Resell-Score</span>
        <strong>${result.resellScore}/100 - ${result.resellLabel}</strong>
      </div>

      <div style="height:14px;background:#ffffff22;border-radius:20px;overflow:hidden;margin-top:8px;">
        <div style="
          width:${result.resellScore}%;
          height:100%;
          background:linear-gradient(90deg,#ff4d4d,#ffd84d,#37e27d);
        "></div>
      </div>
    </div>

    <div style="margin-top:14px;font-size:12px;opacity:.7;">
      Werte sind Schätzungen und keine Garantie für einen tatsächlichen Verkaufspreis.
    </div>
  `;
}

// TESTWERTE
renderDealScore(
  620,  // Kaufpreis
  700,  // Marktpreis
  730,  // geschätzter Verkaufspreis
  20    // Gebühren / Versand
);
</script>
