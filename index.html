<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DealFaz – Deals entdecken, vergleichen und clever handeln.">
  <title>DealFaz – Deals & Reselling</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #070b14;
      color: white;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      padding: 28px 7%;
      font-weight: bold;
      font-size: 24px;
    }

    .logo span, .green { color: #38e6c5; }
    .live { color: #38e6c5; font-size: 14px; }

    main {
      max-width: 900px;
      margin: 110px auto 0;
      text-align: center;
      padding: 20px;
    }

    .region {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid #24334d;
      border-radius: 20px;
      margin-bottom: 25px;
      color: #b8c4d8;
    }

    h1 {
      font-size: clamp(42px, 7vw, 72px);
      line-height: 1.05;
      margin-bottom: 25px;
    }

    p {
      color: #b8c4d8;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .search {
      display: flex;
      background: white;
      padding: 6px;
      border-radius: 12px;
      max-width: 700px;
      margin: auto;
    }

    input {
      flex: 1;
      border: 0;
      outline: 0;
      padding: 17px;
      font-size: 16px;
      border-radius: 9px;
    }

    button {
      border: 0;
      background: #38e6c5;
      padding: 0 28px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    #results {
      max-width: 700px;
      margin: 25px auto;
      text-align: left;
    }

    .result {
      background: #111827;
      border: 1px solid #263248;
      border-radius: 12px;
      padding: 18px;
    }

    .result a {
      color: #38e6c5;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">Deal<span>Faz</span></div>
    <div class="live">● LIVE</div>
  </header>

  <main>
    <div class="region">Deutschland · Österreich · Schweiz</div>

    <h1>Finde den Deal.<br><span class="green">Mach mehr daraus.</span></h1>

    <p>
      DealFaz bringt Deals und Reselling an einen Ort.
      Suche nach einem Artikel und entdecke Möglichkeiten
      zum Kaufen, Vergleichen und Weiterverkaufen.
    </p>

    <div class="search">
      <input id="query" placeholder="Artikelname eingeben">
      <button onclick="searchDeals()">Deal suchen</button>
    </div>

    <div id="results"></div>
  </main>

  <script>
    function searchDeals() {
      const input = document.getElementById("query");
      const query = input.value.trim();
      const results = document.getElementById("results");

      if (!query) {
        results.innerHTML =
          '<div class="result">Bitte zuerst einen Artikel eingeben.</div>';
        return;
      }

      const ebay =
        "https://www.ebay.de/sch/i.html?_nkw=" +
        encodeURIComponent(query);

      const kleinanzeigen =
        "https://www.kleinanzeigen.de/s-" +
        encodeURIComponent(query.replace(/\s+/g, "-")) +
        "/k0";

      results.innerHTML =
        '<div class="result">' +
        '<strong>Suche nach: ' + escapeHtml(query) + '</strong><br><br>' +
        '<a href="' + ebay + '" target="_blank" rel="noopener">→ eBay durchsuchen</a><br><br>' +
        '<a href="' + kleinanzeigen + '" target="_blank" rel="noopener">→ Kleinanzeigen durchsuchen</a>' +
        '</div>';
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById("query").addEventListener("keydown", function(e) {
      if (e.key === "Enter") searchDeals();
    });
  </script>
</script>
</body>
