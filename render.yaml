services:
  - type: web
    runtime: static
    name: dinavo
    branch: main
    buildCommand: echo "DINAVO static site"
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: "public, max-age=0, must-revalidate, no-transform"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: X-Permitted-Cross-Domain-Policies
        value: none
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; style-src 'self'; script-src 'self' 'sha256-koiK3vksjoRYC0RQeh2/AJ0YbHYgX2vBUABTphy9/hk=' https://static.cloudflareinsights.com; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
