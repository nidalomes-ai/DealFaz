<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">DINAVO Beispielrechnung für einen Reselling-Deal</title>
  <desc id="desc">Kostenlose Beta mit einer Beispielrechnung aus Einkauf, Verkauf, Kosten, Gewinn und ROI.</desc>
  <rect width="1080" height="1350" fill="#09111f"/>
  <rect x="54" y="54" width="972" height="1242" rx="46" fill="#101c2f" stroke="#263750" stroke-width="3"/>
  <text x="94" y="154" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="64" font-weight="800" letter-spacing="2">DINA<tspan fill="#86efac">VO</tspan></text>
  <rect x="703" y="91" width="269" height="62" rx="31" fill="#ecfdf3"/>
  <text x="837" y="131" text-anchor="middle" fill="#045d3b" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800">KOSTENLOSE BETA</text>

  <text x="94" y="272" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="65" font-weight="800">Was bleibt wirklich</text>
  <text x="94" y="348" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="65" font-weight="800">vom Deal übrig?</text>
  <text x="94" y="411" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="27">Beispielrechnung · Werte und Gebühren editierbar</text>

  <rect x="94" y="475" width="892" height="512" rx="34" fill="#ffffff"/>
  <text x="145" y="555" fill="#475569" font-family="Arial,Helvetica,sans-serif" font-size="28">Einkauf</text>
  <text x="930" y="555" text-anchor="end" fill="#067647" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800">50,00 €</text>
  <line x1="145" y1="589" x2="935" y2="589" stroke="#d8dee8" stroke-width="2"/>
  <text x="145" y="662" fill="#475569" font-family="Arial,Helvetica,sans-serif" font-size="28">Verkauf</text>
  <text x="930" y="662" text-anchor="end" fill="#067647" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800">100,00 €</text>
  <line x1="145" y1="696" x2="935" y2="696" stroke="#d8dee8" stroke-width="2"/>
  <text x="145" y="769" fill="#475569" font-family="Arial,Helvetica,sans-serif" font-size="28">Gebühr, Versand, Extras</text>
  <text x="930" y="769" text-anchor="end" fill="#067647" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800">21,34 €</text>
  <line x1="145" y1="814" x2="935" y2="814" stroke="#a6e0ba" stroke-width="3"/>
  <text x="145" y="888" fill="#111827" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="800">Rechnerischer Gewinn</text>
  <text x="930" y="888" text-anchor="end" fill="#067647" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="900">28,66 €</text>
  <text x="145" y="950" fill="#475569" font-family="Arial,Helvetica,sans-serif" font-size="28">ROI</text>
  <text x="930" y="950" text-anchor="end" fill="#067647" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800">57,3 %</text>

  <rect x="94" y="1042" width="620" height="88" rx="44" fill="#ffffff"/>
  <text x="404" y="1098" text-anchor="middle" fill="#09111f" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800">Kostenlos mit DINAVO prüfen</text>
  <text x="94" y="1189" fill="#86efac" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800">Link im Profil · ohne Anmeldung</text>
  <text x="94" y="1244" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="22">Rechenhilfe · keine Gewinn- oder Verkaufsgarantie</text>
</svg>

