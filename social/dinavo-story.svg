  <text x="84" y="493" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="50" font-weight="750">einkaufen.</text>
  <text x="84" y="610" fill="#86efac" font-family="Arial,Helvetica,sans-serif" font-size="67" font-weight="900">100,00 €</text>
  <text x="84" y="683" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="50" font-weight="750">verkaufen.</text>
  <text x="84" y="811" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="68" font-weight="900">50 € Gewinn?</text>
  <text x="84" y="875" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="30">Nicht automatisch. Kosten fehlen noch.</text>

  <rect x="84" y="954" width="912" height="480" rx="42" fill="#ffffff"/>
  <text x="140" y="1030" fill="#475569" font-family="Arial,Helvetica,sans-serif" font-size="25">DINAVO-BEISPIELRECHNUNG</text>
  <text x="140" y="1124" fill="#111827" font-family="Arial,Helvetica,sans-serif" font-size="31">Gebühr, Versand, Extras</text>
  <text x="936" y="1124" text-anchor="end" fill="#067647" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="800">21,34 €</text>
  <line x1="140" y1="1171" x2="936" y2="1171" stroke="#d8dee8" stroke-width="2"/>
  <text x="140" y="1261" fill="#111827" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="800">Gewinn</text>
  <text x="936" y="1261" text-anchor="end" fill="#067647" font-family="Arial,Helvetica,sans-serif" font-size="49" font-weight="900">28,66 €</text>
  <text x="140" y="1353" fill="#475569" font-family="Arial,Helvetica,sans-serif" font-size="31">ROI</text>
  <text x="936" y="1353" text-anchor="end" fill="#067647" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="850">57,3 %</text>

  <rect x="84" y="1512" width="752" height="104" rx="52" fill="#ffffff"/>
