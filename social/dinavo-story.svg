  <rect width="1080" height="1920" fill="#09111f"/>
  <circle cx="945" cy="185" r="235" fill="#86efac" opacity="0.10"/>
  <circle cx="100" cy="1730" r="310" fill="#2563eb" opacity="0.10"/>
  <text x="84" y="166" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="800" letter-spacing="2">DINA<tspan fill="#86efac">VO</tspan></text>
  <rect x="84" y="218" width="286" height="62" rx="31" fill="#ecfdf3"/>
  <text x="227" y="259" text-anchor="middle" fill="#045d3b" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800">KOSTENLOSE BETA</text>

